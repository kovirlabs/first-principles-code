#
# pre-commit runs these checks automatically on every `git commit`.
# One-time setup:   uv run pre-commit install
# Run on demand:    uv run pre-commit run --all-files
#
# The hooks are "local": they call the exact ruff/pytest versions pinned in
# uv.lock, so the hook, your editor, and CI always agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, auto-fix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q -x
        language: system
        pass_filenames: false
        always_run: true
