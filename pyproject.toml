[project]
name = "first-principles-code"
version = "0.1.0"
description = "A teaching library of first-principles engineering calculations in Python."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pint>=0.25.3",
    "pydicom>=3.0.2",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
]

# Installing the package also installs an `fpc` terminal command that runs
# fpc/cli.py:main (see docs/building-tools.md, rung 5).
[project.scripts]
fpc = "fpc.cli:main"

# The build system turns this repo into an installable package, so other
# projects can `uv add git+https://github.com/kovirlabs/first-principles-code`
# (or `pip install -e .`) and then `import fpc`. Hatchling is a small,
# standards-based build backend; the distribution name (first-principles-code)
# differs from the import name (fpc), so we point it at the package folder.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpc"]

[dependency-groups]
apps = [
    "streamlit>=1.67.0",
]
dev = [
    "pytest>=9.0.3",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
]

# pytest configuration: where to find tests and how to report.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# Put the project root on sys.path so tests can `import fpc` / `import gui`
# without installing the project as a package.
pythonpath = ["."]
