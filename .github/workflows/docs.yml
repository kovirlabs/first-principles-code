#
# Builds the documentation site (mkdocs + mkdocstrings) on every pull request
# so broken links or docstrings fail early, and publishes it to GitHub Pages
# on every push to main. To redeploy without a commit: Actions -> docs ->
# "Run workflow".
#
# One-time repository setup: Settings -> Pages -> Source: "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab for manual redeploys.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the newest supported Python (managed by scripts/python_support.py)
        run: |
          uv python install 3.15
          echo "UV_PYTHON=3.15" >> "$GITHUB_ENV"

      - name: Build (strict - warnings are errors)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --group docs mkdocs build --strict

      - name: Upload site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
