#
# Builds the documentation site (mkdocs + mkdocstrings) on every pull request
# so broken links or docstrings fail early, and publishes it to GitHub Pages
# on every push to main.
#
# One-time repository setup: Settings -> Pages -> Source: "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build (strict - warnings are errors)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --group docs mkdocs build --strict

      - name: Upload site for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
