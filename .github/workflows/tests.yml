#
# Runs lint, format check, type check, and the pytest suite on every push to
# main and on every pull request.
# Uses uv (the same tool the project develops with) so CI matches local dev.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: checks + pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Cache uv's package downloads between runs to speed up CI.
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies (incl. dev group)
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # --all-groups above installed the notebook tools, so this also
      # executes every notebook and runs every example script.
      - name: Run pytest
        run: uv run pytest
